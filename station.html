<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="title">Loading...</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.player-container {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #d6d6d6;
    border-radius: 6px;
    padding: 0;            /* REMOVE PADDING */
    margin: 0;
    box-sizing: border-box;
}

.play-wrapper {
    width: 48px;
    height: 46px;          /* REDUCED to fit inside 50px frame */
    display: flex;
    justify-content: center;
    align-items: center;
}


.station-title {
    margin-left: 12px;
    font-size: 16px;
    font-weight: bold;
    color: #000;
    line-height: 1; /* keeps text centered vertically */
}
</style>
</head>

<body>

<div class="player-container">

    <!-- Play/Pause/Stop Button -->
    <div class="play-wrapper" id="playButton">
        <svg width="40" height="40" viewBox="0 0 42 42">

            <!-- Background Circle -->
            <path 
              d="M21 5.084505690810467 
                 a 15.915494309189533 15.915494309189533 0 0 1 0 31.830988618379067 
                 a 15.915494309189533 15.915494309189533 0 0 1 0 -31.830988618379067"
              fill="#27292D"
              stroke="#27292D"
              stroke-width="2">
            </path>

            <!-- Play Icon -->
            <path id="playIcon" d="M16 13 L28 21 L16 29 Z" fill="white"></path>

            <!-- Stop Icon -->
            <path 
              id="stopIcon" 
              d="M14 14 H28 V28 H14 Z" 
              fill="white" 
              style="display:none;">
            </path>

        </svg>
    </div>

    <!-- Station Title (Dynamic) -->
    <div class="station-title" id="stationName">Loading...</div>

</div>

<!-- Hidden Audio Element -->
<audio id="audio" crossorigin="anonymous"></audio>
<script>
// ===============================
// LOAD STATION FROM URL (?id=xxx)
// ===============================

(async () => {
    const params = new URLSearchParams(window.location.search);
    const stationId = params.get("id");

    const stations = await fetch("/stations.json").then(r => r.json());
    const station = stations.find(s => s.station_id === stationId);

    if (!station) {
        document.body.innerHTML = "<h1>Station not found</h1>";
        return;
    }

    // Set title + station info
    document.getElementById("title").innerText = station.station_name;
    document.getElementById("stationName").innerText = station.station_name;

    // Assign stream
    const audio = document.getElementById("audio");
    audio.crossOrigin = "anonymous";
    audio.src = station.station_stream_url;
})();
</script>

<script>
// ===============================
// PLAYER LOGIC
// ===============================

const audio = document.getElementById("audio");
const btn   = document.getElementById("playButton");

const playIcon  = document.getElementById("playIcon");
const stopIcon = document.getElementById("stopIcon");

// Player state: "stopped", "playing", "paused"
let state = "stopped";

// Toggle sequence: Play → Pause → Stop → Play
btn.onclick = () => {

    if (state === "stopped") {
        audio.currentTime = 0;
        audio.play();
        state = "playing";

        playIcon.style.display = "none";
        stopIcon.style.display = "block";
        return;
    }

    if (state === "playing") {
        audio.currentTime = 0;
        audio.pause();
        state = "stopped";

        playIcon.style.display = "block";
        stopIcon.style.display = "none";
        return;
    }
};
</script>

</body>
</html>
